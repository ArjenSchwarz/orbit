{{define "content"}}
<a href="/" class="back-link">&larr; Back to sessions</a>

<div class="session-meta">
    <span class="source-badge source-{{.Source}}">{{.Source}}</span>
    <span class="session-meta-id">{{.SessionID}}</span>
    {{if .ThreadID}}<span class="session-meta-item">Thread ID {{.ThreadID}}</span>{{end}}
    <time class="session-meta-item" datetime="{{.CreatedAt}}">{{.CreatedAt}}</time>
    {{if .FileTime}}<span class="session-meta-item">file modified</span>{{end}}
    <span class="session-meta-item">{{.Size}}</span>
</div>

{{if .Warnings}}
<div class="warning-banner">
    {{range .Warnings}}
    <p>{{.}}</p>
    {{end}}
</div>
{{end}}

<div class="transcript-wrapper">
    {{.Content}}
</div>
{{end}}
