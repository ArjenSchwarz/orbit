version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # SA5011 false positive: staticcheck doesn't understand that t.Fatal stops execution,
      # so "if x == nil { t.Fatal(...) }; x.Field" is flagged as a possible nil deref.
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
