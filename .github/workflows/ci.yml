name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.9"
      - name: Run tests
        run: go test ./...
      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
      - name: Build binaries
        run: |
          go build -o orbit ./cmd/orbit
          go build -o apsis ./cmd/apsis
